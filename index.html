<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusPlay | Venta de Juegos Digitales</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0d0f18;
            --bg-panel: #16192b;
            --bg-card: #1e2238;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2a2f4c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(13, 15, 24, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .search-bar {
            flex: 1;
            max-width: 450px;
            margin: 0 2rem;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--accent-cyan);
        }

        .search-bar i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .cart-btn {
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
            position: relative;
        }

        .cart-btn:hover {
            opacity: 0.9;
        }

        .cart-badge {
            background-color: var(--accent-cyan);
            color: var(--bg-main);
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
            flex: 1;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(6, 182, 212, 0.15));
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero-banner h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1.25rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-purple);
            border-color: var(--accent-purple);
            color: white;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .game-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
        }

        .game-img-container {
            height: 160px;
            background-color: #2b3154;
            position: relative;
            overflow: hidden;
        }

        .game-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .game-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .game-dev {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .buy-btn {
            background-color: var(--accent-cyan);
            color: var(--bg-main);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }

        /* Carrito Lateral */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            z-index: 200;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
            padding: 0.75rem;
            border-radius: 8px;
        }

        .cart-item-details h4 {
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .cart-item-details span {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .remove-item {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            z-index: 150;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            header { padding: 1rem; }
            .search-bar { display: none; }
            .cart-drawer { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i> NexusPlay
        </div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Buscar juegos digitales...">
        </div>
        <button class="cart-btn" id="cartToggle">
            <i class="fa-solid fa-cart-shopping"></i> Carrito
            <span class="cart-badge" id="cartCount">0</span>
        </button>
    </header>

    <div class="main-container">
        <div class="hero-banner">
            <h1>Tus juegos digitales al instante</h1>
            <p>Claves originales, entrega inmediata y las mejores ofertas del mercado gamer.</p>
        </div>

        <div class="filters" id="categoryFilters">
            <button class="filter-btn active" data-category="all">Todos</button>
            <button class="filter-btn" data-category="Acción">Acción</button>
            <button class="filter-btn" data-category="RPG">RPG</button>
            <button class="filter-btn" data-category="Estrategia">Estrategia</button>
            <button class="filter-btn" data-category="Indie">Indie</button>
        </div>

        <div class="games-grid" id="gamesGrid">
            <!-- Los juegos se cargan dinámicamente con JS -->
        </div>
    </div>

    <!-- Carrito Desplegable -->
    <div class="overlay" id="overlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Tu Carrito de Compras</h3>
            <button class="close-cart" id="closeCart"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cartItems">
            <p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">El carrito está vacío</p>
        </div>
        <div class="cart-footer">
            <div class="total-row">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Finalizar Compra</button>
        </div>
    </div>

    <script>
        const games = [
            { id: 1, title: "Cyber Odyssey", dev: "FutureSoft", price: 29.99, category: "Acción", image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=500&q=80" },
            { id: 2, title: "Shadow Legends", dev: "Mythic Realm", price: 39.99, category: "RPG", image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=500&q=80" },
            { id: 3, title: "Galaxy Tactics", dev: "Stellar Games", price: 19.99, category: "Estrategia", image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=500&q=80" },
            { id: 4, title: "Pixel Dungeon", dev: "RetroBit", price: 9.99, category: "Indie", image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=500&q=80" },
            { id: 5, title: "Apex Vanguard", dev: "Iron Forge", price: 49.99, category: "Acción", image: "https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?auto=format&fit=crop&w=500&q=80" },
            { id: 6, title: "Eldoria Chronicles", dev: "Lore Weaver", price: 59.99, category: "RPG", image: "https://images.unsplash.com/photo-1612287233002-91d0f53267c3?auto=format&fit=crop&w=500&q=80" }
        ];

        let cart = [];

        const gamesGrid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const cartToggle = document.getElementById('cartToggle');
        const cartDrawer = document.getElementById('cartDrawer');
        const closeCart = document.getElementById('closeCart');
        const overlay = document.getElementById('overlay');
        const cartItemsContainer = document.getElementById('cartItems');
        const cartCount = document.getElementById('cartCount');
        const cartTotal = document.getElementById('cartTotal');
        const categoryFilters = document.getElementById('categoryFilters');
        const checkoutBtn = document.getElementById('checkoutBtn');

        function renderGames(gamesToRender) {
            gamesGrid.innerHTML = '';
            if (gamesToRender.length === 0) {
                gamesGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No se encontraron juegos.</p>`;
                return;
            }
            gamesToRender.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-img-container">
                        <span class="game-tag">${game.category}</span>
                        <img src="${game.image}" alt="${game.title}">
                    </div>
                    <div class="game-info">
                        <div>
                            <h3 class="game-title">${game.title}</h3>
                            <p class="game-dev">${game.dev}</p>
                        </div>
                        <div class="game-footer">
                            <span class="game-price">$${game.price.toFixed(2)}</span>
                            <button class="buy-btn" onclick="addToCart(${game.id})">Comprar</button>
                        </div>
                    </div>
                `;
                gamesGrid.appendChild(card);
            });
        }

        function addToCart(id) {
            const game = games.find(g => g.id === id);
            cart.push(game);
            updateCart();
            openCartDrawer();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function updateCart() {
            cartCount.textContent = cart.length;
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">El carrito está vacío</p>`;
                cartTotal.textContent = '$0.00';
                return;
            }

            cartItemsContainer.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item';
                itemEl.innerHTML = `
                    <div class="cart-item-details">
                        <h4>${item.title}</h4>
                        <span>$${item.price.toFixed(2)}</span>
                    </div>
                    <button class="remove-item" onclick="removeFromCart(${index})"><i class="fa-solid fa-trash"></i></button>
                `;
                cartItemsContainer.appendChild(itemEl);
            });
            cartTotal.textContent = `$${total.toFixed(2)}`;
        }

        function openCartDrawer() {
            cartDrawer.classList.add('open');
            overlay.classList.add('active');
        }

        function closeCartDrawer() {
            cartDrawer.classList.remove('open');
            overlay.classList.remove('active');
        }

        cartToggle.addEventListener('click', openCartDrawer);
        closeCart.addEventListener('click', closeCartDrawer);
        overlay.addEventListener('click', closeCartDrawer);

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = games.filter(g => g.title.toLowerCase().includes(term) || g.dev.toLowerCase().includes(term));
            renderGames(filtered);
        });

        categoryFilters.addEventListener('click', (e) => {
            if (!e.target.classList.contains('filter-btn')) return;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            const category = e.target.getAttribute('data-category');
            if (category === 'all') {
                renderGames(games);
            } else {
                renderGames(games.filter(g => g.category === category));
            }
        });

        checkoutBtn.addEventListener('click', () => {
            if (cart.length === 0) return;
            alert('¡Compra simulada con éxito! Gracias por probar tu tienda de juegos digitales.');
            cart = [];
            updateCart();
            closeCartDrawer();
        });

        renderGames(games);
    </script>
</body>
</html>
